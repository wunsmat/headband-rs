name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin: target/release/headband-rs
            out: headband
          - os: windows-latest
            bin: target/release/headband-rs.exe
            out: headband.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cp ${{ matrix.bin }} ${{ matrix.out }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "${GITHUB_REF_NAME}" headband headband.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
